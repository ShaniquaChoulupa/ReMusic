name: Build ReMusic
on: [push, workflow_dispatch]
jobs:
  build:
    # Linux runner: Theos's own toolchain can still build 32-bit (armv7),
    # which current Xcode on macOS no longer can.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build
        run: make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: ReMusic
          path: |
            packages/*.deb
            .theos/obj/ReMusic.dylib
